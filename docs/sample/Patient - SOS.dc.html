<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Atkinson Hyperlegible',sans-serif;color:#fff;background:#7A1D22}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes urgent{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.18);opacity:.2}}
  @keyframes ring2{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.5);opacity:0}}
  @keyframes dwellS{0%{stroke-dashoffset:534}100%{stroke-dashoffset:140}}
</style>
</helmet>

<div style="position:relative;width:100%;min-height:100vh;background:radial-gradient(900px 700px at 50% 36%,#B83036 0%,#8A2127 55%,#6E171C 100%);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px">

  <!-- status pill -->
  <div style="position:absolute;top:34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);border-radius:999px;padding:12px 24px;backdrop-filter:blur(6px)">
    <span style="width:11px;height:11px;border-radius:50%;background:#fff;display:inline-block;animation:breathe 1s ease-in-out infinite"></span>
    <span style="font-weight:700;font-size:17px;letter-spacing:.04em">EMERGENCY ACTIVE · 0:08</span>
  </div>

  <!-- urgent blob -->
  <div style="position:relative;width:240px;height:240px;margin-bottom:38px">
    <div style="position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.5);animation:ring2 2s ease-out infinite"></div>
    <div style="position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.5);animation:ring2 2s ease-out 1s infinite"></div>
    <div style="position:absolute;inset:-14px;border-radius:50%;background:#E5484D;animation:urgent 1.1s ease-in-out infinite"></div>
    <div style="position:relative;width:100%;height:100%;animation:breathe 1.2s ease-in-out infinite;transform-origin:center">
      <svg viewBox="0 0 200 200" style="width:100%;height:100%;filter:drop-shadow(0 14px 30px rgba(0,0,0,.3))">
        <defs><radialGradient id="sos_blob" cx="40%" cy="32%"><stop offset="0%" stop-color="#FFD2C2"/><stop offset="48%" stop-color="#FB7185"/><stop offset="100%" stop-color="#E5484D"/></radialGradient></defs>
        <path d="M100 18C140 18 174 46 178 90C181 124 166 156 130 172C102 184 62 180 39 156C18 134 16 96 28 68C42 36 68 18 100 18Z" fill="url(#sos_blob)"/>
        <ellipse cx="80" cy="94" rx="9" ry="13" fill="#6B1418"/><ellipse cx="120" cy="94" rx="9" ry="13" fill="#6B1418"/>
        <path d="M86 130C94 123 106 123 114 130" stroke="#6B1418" stroke-width="6" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
  </div>

  <div style="font-family:'Source Serif 4',serif;font-size:60px;font-weight:600;letter-spacing:-.015em;margin-bottom:12px;text-align:center">Help is on the way.</div>
  <div style="font-size:22px;color:rgba(255,255,255,.85);margin-bottom:34px;text-align:center;max-width:600px">Stay with me, John. I've alerted your care team and I'm keeping the line open.</div>

  <!-- notified -->
  <div style="display:flex;gap:16px;margin-bottom:44px;flex-wrap:wrap;justify-content:center">
    <div style="display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.14);border-radius:18px;padding:16px 24px">
      <div style="width:46px;height:46px;border-radius:50%;background:#fff;color:#0E9384;display:flex;align-items:center;justify-content:center;font-size:24px">✓</div>
      <div style="text-align:left"><div style="font-weight:700;font-size:18px">Maya · daughter</div><div style="font-size:15px;color:rgba(255,255,255,.75)">Called · ringing…</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.14);border-radius:18px;padding:16px 24px">
      <div style="width:46px;height:46px;border-radius:50%;background:#fff;color:#0E9384;display:flex;align-items:center;justify-content:center;font-size:24px">✓</div>
      <div style="text-align:left"><div style="font-weight:700;font-size:18px">Nurse station</div><div style="font-size:15px;color:rgba(255,255,255,.75)">Notified · 0:06</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.14);border-radius:18px;padding:16px 24px">
      <div style="width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px">📍</div>
      <div style="text-align:left"><div style="font-weight:700;font-size:18px">Location shared</div><div style="font-size:15px;color:rgba(255,255,255,.75)">Room 214 · Bed A</div></div>
    </div>
  </div>

  <!-- cancel -->
  <div style="position:relative;display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.95);border-radius:999px;padding:20px 36px 20px 22px">
    <div style="position:relative;width:60px;height:60px">
      <svg viewBox="0 0 100 100" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="50" cy="50" r="44" fill="none" stroke="#EADfd4" stroke-width="7"/><circle cx="50" cy="50" r="44" fill="none" stroke="#6E171C" stroke-width="7" stroke-linecap="round" stroke-dasharray="276" style="animation:dwellS 2.5s linear infinite"/></svg>
      <div style="position:absolute;inset:14px;border-radius:50%;background:#F4EEE6;display:flex;align-items:center;justify-content:center;font-size:24px">✓</div>
    </div>
    <div style="text-align:left">
      <div style="font-size:24px;font-weight:700;color:#6E171C">I'm okay — cancel</div>
      <div style="font-size:15px;color:#9A4444;font-weight:700">Hold gaze to stop the alert</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
