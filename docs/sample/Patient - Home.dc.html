<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Atkinson Hyperlegible',sans-serif;color:#241E2B;background:#F4EEE6}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  @keyframes glowPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.78;transform:scale(1.09)}}
  @keyframes dwell{0%{stroke-dashoffset:534}100%{stroke-dashoffset:160}}
</style>
</helmet>

<div style="position:relative;width:100%;min-height:100vh;background:radial-gradient(1100px 760px at 50% 22%,#FBF6F0 0%,#F4EEE6 52%,#EFE7DC 100%);overflow:hidden;display:flex;flex-direction:column">

  <!-- soft ambient blobs -->
  <div style="position:absolute;top:-160px;left:-120px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,#E7DBFF,transparent 70%);opacity:.6"></div>
  <div style="position:absolute;bottom:-180px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#FBDCEF,transparent 70%);opacity:.5"></div>

  <!-- STATUS BAR -->
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:28px 44px;z-index:2">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="display:flex;align-items:center;gap:9px;background:#fff;border-radius:999px;padding:11px 20px;box-shadow:0 1px 3px rgba(36,30,43,.06)">
        <span style="width:10px;height:10px;border-radius:50%;background:#0E9384;display:inline-block;box-shadow:0 0 0 4px rgba(14,147,132,.18)"></span>
        <span style="font-weight:700;font-size:16px;color:#0B6F63">Eye tracking on</span>
      </div>
      <div style="background:#fff;border-radius:999px;padding:11px 20px;font-weight:700;font-size:16px;color:#5B3FD6;box-shadow:0 1px 3px rgba(36,30,43,.06)">Dwell · 1.8s</div>
    </div>
    <div style="display:flex;align-items:center;gap:18px">
      <div style="display:flex;align-items:center;gap:9px;background:#fff;border-radius:999px;padding:11px 20px;box-shadow:0 1px 3px rgba(36,30,43,.06)">
        <span style="font-size:18px">👩‍⚕️</span><span style="font-weight:700;font-size:16px;color:#6B6470">Maya is nearby</span>
      </div>
      <div style="font-weight:700;font-size:17px;color:#6B6470">2:14 PM</div>
      <div style="display:flex;align-items:center;gap:7px;color:#6B6470;font-weight:700;font-size:16px"><span style="font-size:18px">🔋</span>82%</div>
    </div>
  </div>

  <!-- CENTER -->
  <div style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;padding-bottom:20px">
    <div style="position:relative;width:300px;height:300px;margin-bottom:6px">
      <div style="position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle at 42% 36%,#CDBaFF,#9C7BF5 55%,#EC8FDE);filter:blur(40px);opacity:.6;animation:glowPulse 5s ease-in-out infinite"></div>
      <div style="position:absolute;inset:0;animation:float 6.5s ease-in-out infinite">
        <div style="width:100%;height:100%;animation:breathe 4.6s ease-in-out infinite;transform-origin:center">
          <svg viewBox="0 0 200 200" style="width:100%;height:100%;filter:drop-shadow(0 26px 46px rgba(124,92,252,.30))">
            <defs><radialGradient id="h_blob" cx="38%" cy="30%" r="78%"><stop offset="0%" stop-color="#D9C9FF"/><stop offset="52%" stop-color="#A98CF7"/><stop offset="100%" stop-color="#EC8FDE"/></radialGradient></defs>
            <path d="M100 18C140 18 174 46 178 90C181 124 166 156 130 172C102 184 62 180 39 156C18 134 16 96 28 68C42 36 68 18 100 18Z" fill="url(#h_blob)"/>
            <ellipse cx="74" cy="76" rx="22" ry="24" fill="#fff" opacity=".22"/>
            <g style="transform-origin:center;animation:blink 6.5s ease-in-out infinite">
              <ellipse cx="80" cy="96" rx="9" ry="12" fill="#3A2566"/><ellipse cx="122" cy="96" rx="9" ry="12" fill="#3A2566"/>
              <circle cx="83" cy="91" r="3.2" fill="#fff"/><circle cx="125" cy="91" r="3.2" fill="#fff"/>
            </g>
            <path d="M86 124C95 133 108 133 116 124" stroke="#3A2566" stroke-width="5.5" stroke-linecap="round" fill="none" opacity=".72"/>
          </svg>
        </div>
      </div>
    </div>
    <div style="font-family:'Source Serif 4',serif;font-size:46px;font-weight:600;letter-spacing:-.015em;margin-bottom:8px">Good afternoon, John.</div>
    <div style="font-size:22px;color:#6B6470">Look at a card to begin. I'm right here.</div>
  </div>

  <!-- TILE ROW -->
  <div style="position:relative;z-index:2;display:flex;gap:22px;justify-content:center;padding:0 44px 22px">
    <div style="position:relative;flex:1;max-width:300px;background:#fff;border-radius:28px;padding:34px 30px;box-shadow:0 8px 24px rgba(36,30,43,.07)">
      <svg viewBox="0 0 100 100" style="position:absolute;top:18px;right:18px;width:46px;height:46px;transform:rotate(-90deg)"><circle cx="50" cy="50" r="44" fill="none" stroke="#EFE9FF" stroke-width="6"/><circle cx="50" cy="50" r="44" fill="none" stroke="#7C5CFC" stroke-width="6" stroke-linecap="round" stroke-dasharray="276" stroke-dashoffset="190"/></svg>
      <div style="width:64px;height:64px;border-radius:20px;background:#EFE9FF;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:20px">✉️</div>
      <div style="font-size:26px;font-weight:700;margin-bottom:6px">Messages</div>
      <div style="font-size:17px;color:#6B6470">2 new from Maya</div>
    </div>
    <div style="flex:1;max-width:300px;background:#fff;border-radius:28px;padding:34px 30px;box-shadow:0 8px 24px rgba(36,30,43,.07)">
      <div style="width:64px;height:64px;border-radius:20px;background:#D9F6F0;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:20px">💬</div>
      <div style="font-size:26px;font-weight:700;margin-bottom:6px">Say something</div>
      <div style="font-size:17px;color:#6B6470">Compose with AI</div>
    </div>
    <div style="flex:1;max-width:300px;background:#fff;border-radius:28px;padding:34px 30px;box-shadow:0 8px 24px rgba(36,30,43,.07)">
      <div style="width:64px;height:64px;border-radius:20px;background:#FBE6F2;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:20px">⚖️</div>
      <div style="font-size:26px;font-weight:700;margin-bottom:6px">Yes / No</div>
      <div style="font-size:17px;color:#6B6470">Answer quickly</div>
    </div>
    <div style="flex:1;max-width:300px;background:#fff;border-radius:28px;padding:34px 30px;box-shadow:0 8px 24px rgba(36,30,43,.07)">
      <div style="width:64px;height:64px;border-radius:20px;background:#FFF1DF;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:20px">🙋</div>
      <div style="font-size:26px;font-weight:700;margin-bottom:6px">I need help</div>
      <div style="font-size:17px;color:#6B6470">Call a caregiver</div>
    </div>
  </div>

  <!-- BOTTOM BAR: SOS -->
  <div style="position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 44px 32px">
    <div style="display:flex;align-items:center;gap:12px;color:#9A93A0;font-weight:700;font-size:16px"><span style="font-size:20px">⚙️</span> Settings &amp; calibration</div>
    <div style="display:flex;align-items:center;gap:16px;background:#FDECEC;border:2px solid #F3B7B7;border-radius:999px;padding:16px 32px">
      <span style="font-size:26px">🆘</span>
      <span style="font-size:24px;font-weight:700;color:#C62A2F">Emergency SOS</span>
      <span style="font-size:15px;color:#C97A7A;font-weight:700;border-left:1px solid #F0C4C4;padding-left:16px">Hold gaze 3s</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
