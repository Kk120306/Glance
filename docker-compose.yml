services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glance}
      POSTGRES_DB: glance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d glance']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-glance}@postgres:5432/glance
      PATIENT_DEVICE_TOKEN: ${PATIENT_DEVICE_TOKEN:?Set PATIENT_DEVICE_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  ws-server:
    build:
      context: .
      target: ws-server
    restart: unless-stopped
    environment:
      PORT: '4000'
      WS_INTERNAL_SECRET: ${WS_INTERNAL_SECRET:?Set WS_INTERNAL_SECRET in .env}
    ports:
      - '${WS_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:4000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    build:
      context: .
      target: dashboard
      args:
        NEXT_PUBLIC_APP_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_SERVER_URL: ${PUBLIC_WS_URL:-http://localhost:4000}
        NEXT_PUBLIC_PATIENT_APP_URL: ${PUBLIC_PATIENT_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-glance}@postgres:5432/glance
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:3001}
      WS_SERVER_URL: http://ws-server:4000
      WS_INTERNAL_SECRET: ${WS_INTERNAL_SECRET}
      PATIENT_DEVICE_TOKEN: ${PATIENT_DEVICE_TOKEN}
      NEXT_PUBLIC_WS_SERVER_URL: ${PUBLIC_WS_URL:-http://localhost:4000}
      NEXT_PUBLIC_PATIENT_APP_URL: ${PUBLIC_PATIENT_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_DEFAULT_VOICE_ID: ${ELEVENLABS_DEFAULT_VOICE_ID:-}
    ports:
      - '${DASHBOARD_PORT:-3001}:3001'
    volumes:
      - dashboard_uploads:/app/apps/dashboard/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ws-server:
        condition: service_healthy

  patient:
    build:
      context: .
      target: patient
      args:
        NEXT_PUBLIC_APP_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_SERVER_URL: ${PUBLIC_WS_URL:-http://localhost:4000}
        NEXT_PUBLIC_PATIENT_APP_URL: ${PUBLIC_PATIENT_URL:-http://localhost:3000}
        DASHBOARD_INTERNAL_URL: http://dashboard:3001
    restart: unless-stopped
    environment:
      DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:3001}
      DASHBOARD_INTERNAL_URL: http://dashboard:3001
      WS_SERVER_URL: ${PUBLIC_WS_URL:-http://localhost:4000}
      PATIENT_DEVICE_TOKEN: ${PATIENT_DEVICE_TOKEN:-}
      MESSAGE_DISPLAY_SECONDS: ${MESSAGE_DISPLAY_SECONDS:-30}
    ports:
      - '${PATIENT_PORT:-3000}:3000'
    depends_on:
      dashboard:
        condition: service_started
      ws-server:
        condition: service_healthy

volumes:
  postgres_data:
  dashboard_uploads:
